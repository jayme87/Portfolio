<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ibrahim · Identidades Visuais</title>
<link rel="icon" type="image/webp" href="1x/IB.webp">
<meta property="og:title" content="Ibrahim · Identidades Visuais">
<meta property="og:description" content="Projetos de identidade visual: Kurt's Corte, Mestre do Fliperama e marca pessoal Ibrahim.">
<meta property="og:image" content="1x/IB.webp">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ===== ESTILOS (MESMO DO ORIGINAL) ===== */
:root { --ink: #0b0b0b; --ivory: #e9e9ea; --gold: #f4d03d; --gold-light: #f7dc6f; --ash: #8a8480; --mist: #d4cfc6; --deep: #111111; --cream: #ebe5d8; --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Cormorant Garamond', serif; background: var(--ink); color: var(--ivory); }
.site-header { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 1.5rem 4rem; background: rgba(11,11,11,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(244,208,61,0.12); }
.header-back { display: flex; align-items: center; gap: 0.8rem; font-family: 'DM Mono', monospace; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ash); text-decoration: none; }
.header-back:hover { color: var(--gold); }
.header-section-name { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); opacity: 0.8; }
.portfolio-hero { padding: 5rem 4rem 3rem; border-bottom: 1px solid rgba(255,255,255,0.06); }
.portfolio-hero-title { font-family: 'Playfair Display', serif; font-size: clamp(3.5rem, 7vw, 8rem); font-weight: 900; line-height: 0.9; letter-spacing: -0.03em; }
.portfolio-hero-title em { display: block; font-style: italic; color: var(--gold); }
.identidades-grid { max-width: 1400px; margin: 0 auto; padding: 5rem 4rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3rem; }
.identity-card { transition: var(--transition-smooth); cursor: pointer; }
.identity-card:hover { transform: translateY(-6px); }
.identity-card-img { position: relative; overflow: hidden; aspect-ratio: 4/3; margin-bottom: 1.5rem; }
.identity-card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
.identity-card:hover .identity-card-img img { transform: scale(1.03); }
.identity-card-num { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 0.3em; color: var(--gold); margin-bottom: 0.5rem; }
.identity-card-title { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 700; color: var(--ivory); margin-bottom: 0.4rem; }
.identity-card-sub { font-size: 0.9rem; color: var(--ash); font-style: italic; }
.site-footer { border-top: 1px solid rgba(255,255,255,0.06); padding: 2rem 4rem; display: flex; align-items: center; justify-content: space-between; }
.footer-copy { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 0.2em; color: var(--ash); }
@media (max-width: 900px) { .identidades-grid { grid-template-columns: 1fr 1fr; padding: 3rem 2rem; } }
@media (max-width: 600px) { .identidades-grid { grid-template-columns: 1fr; } }
.float-contact-btn { position: fixed; bottom: 2rem; right: 2rem; width: 56px; height: 56px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--ink); font-size: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.3); transition: var(--transition-smooth); z-index: 1050; border: none; cursor: pointer; }
.float-contact-btn:hover { transform: scale(1.08); background: var(--gold-light); }
.contact-modal { position: fixed; bottom: 5rem; right: 2rem; width: 380px; max-width: calc(100vw - 2rem); background: var(--deep); border: 1px solid rgba(244,208,61,0.3); border-radius: 12px; padding: 1.8rem; z-index: 1051; backdrop-filter: blur(20px); background: rgba(17,17,17,0.95); box-shadow: 0 20px 35px rgba(0,0,0,0.4); transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); opacity: 0; visibility: hidden; transform: translateY(15px); }
.contact-modal.open { opacity: 1; visibility: visible; transform: translateY(0); }
.contact-modal h3 { font-family: 'Playfair Display', serif; font-size: 1.6rem; margin-bottom: 0.25rem; color: var(--gold); }
.contact-modal p { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--ash); margin-bottom: 1.5rem; letter-spacing: 0.1em; }
.contact-modal .form-field { margin-bottom: 1rem; }
.contact-modal input, .contact-modal textarea { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: var(--ivory); padding: 0.7rem 1rem; font-family: 'Cormorant Garamond', serif; font-size: 0.95rem; }
.modal-buttons { display: flex; gap: 1rem; margin-top: 1rem; }
.modal-buttons button { flex: 1; background: transparent; border: 1px solid var(--gold); color: var(--gold); font-family: 'DM Mono', monospace; font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; padding: 0.8rem; transition: var(--transition-smooth); cursor: pointer; }
.modal-buttons button:hover { background: var(--gold); color: var(--ink); }
.close-modal { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: var(--ash); font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
<header class="site-header"><a href="index.html" class="header-back"><i class="fas fa-arrow-left"></i> Início</a><span class="header-section-name">Identidades Visuais</span></header>
<div class="portfolio-hero"><h2 class="portfolio-hero-title">Identidades<br><em>Visuais</em></h2></div>
<div class="identidades-grid" id="identidades-grid"></div>
<footer class="site-footer"><span class="footer-copy">© 2026 Ibrahim · Identidades Visuais</span><div class="footer-gold-line"></div></footer>
<button class="float-contact-btn" id="floatContactBtn"><i class="fas fa-comment-dots"></i></button>
<div class="contact-modal" id="contactModal"><button class="close-modal" id="closeModalBtn"><i class="fas fa-times"></i></button><h3>Contato</h3><p>Envie uma mensagem rápida</p><div class="form-field"><label>Nome</label><input type="text" id="modal-nome" placeholder="Seu nome"></div><div class="form-field"><label>E-mail</label><input type="email" id="modal-email" placeholder="seu@email.com"></div><div class="form-field"><label>Mensagem</label><textarea id="modal-msg" rows="3" placeholder="Sua mensagem..."></textarea></div><div class="modal-buttons"><button id="modalWhatsBtn"><i class="fab fa-whatsapp"></i> WhatsApp</button><button id="modalEmailBtn"><i class="fas fa-envelope"></i> E-mail</button></div></div>
<script>
const projetos = [{ id: 'kurt', titulo: "Kurt's Corte", sub: 'Barbearia · Identidade Visual', capa: '1x/KC01.webp' }, { id: 'mestre', titulo: 'Mestre do Fliperama', sub: 'Oficina · Identidade Visual', capa: '1x/MF01.webp' }, { id: 'ibrahim', titulo: 'Ibrahim', sub: 'Marca Pessoal · Identidade Visual', capa: '1x/IB01.webp' }];
const grid = document.getElementById('identidades-grid');
projetos.forEach((p, i) => { const card = document.createElement('div'); card.className = 'identity-card'; card.innerHTML = `<div class="identity-card-img"><img src="${p.capa}" alt="${p.titulo}" loading="lazy"></div><div class="identity-card-num">0${i+1}</div><div class="identity-card-title">${p.titulo}</div><div class="identity-card-sub">${p.sub}</div>`; card.addEventListener('click', () => window.location.href = `${p.id}.html`); grid.appendChild(card); });
// Sons
let audioCtx = null, soundEnabled = false;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); soundEnabled = true; }
function playSound(type) {
  if (!soundEnabled || !audioCtx) return;
  const now = audioCtx.currentTime;
  if (type === 'click') {
    const gain = audioCtx.createGain(); gain.connect(audioCtx.destination); gain.gain.value = 0;
    const osc = audioCtx.createOscillator(); osc.type = 'sine'; osc.connect(gain); osc.frequency.value = 523.25;
    gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
    osc.start(now); osc.stop(now + 0.2);
  } else if (type === 'hover') {
    const gain = audioCtx.createGain(); gain.connect(audioCtx.destination); gain.gain.value = 0;
    const osc = audioCtx.createOscillator(); osc.type = 'sine'; osc.connect(gain); osc.frequency.value = 392;
    osc.frequency.exponentialRampToValueAtTime(523.25, now + 0.15);
    gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
    osc.start(now); osc.stop(now + 0.25);
  }
}
const unlockAudio = () => { if (!audioCtx) initAudio(); if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); };
document.body.addEventListener('click', unlockAudio, { once: true });
document.body.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
let lastHover = 0;
document.querySelectorAll('button, a, .identity-card').forEach(el => {
  el.addEventListener('mouseenter', () => { const now = Date.now(); if (now - lastHover > 80) { playSound('hover'); lastHover = now; } });
  el.addEventListener('click', () => playSound('click'));
});
// Botão flutuante
const floatBtn = document.getElementById('floatContactBtn'), contactModalDiv = document.getElementById('contactModal'), closeModalBtn = document.getElementById('closeModalBtn'), modalWhats = document.getElementById('modalWhatsBtn'), modalEmail = document.getElementById('modalEmailBtn');
function toggleContactModal(open) { if (open) contactModalDiv.classList.add('open'); else contactModalDiv.classList.remove('open'); }
floatBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleContactModal(!contactModalDiv.classList.contains('open')); });
closeModalBtn.addEventListener('click', () => toggleContactModal(false));
document.addEventListener('click', (e) => { if (contactModalDiv.classList.contains('open') && !contactModalDiv.contains(e.target) && e.target !== floatBtn && !floatBtn.contains(e.target)) toggleContactModal(false); });
modalWhats.addEventListener('click', () => { const nome = document.getElementById('modal-nome').value.trim(), email = document.getElementById('modal-email').value.trim(), msg = document.getElementById('modal-msg').value.trim(); if (!nome || !email || !msg) { alert('Preencha nome, e-mail e mensagem.'); return; } window.open(`https://wa.me/5511947846658?text=*Nome:* ${encodeURIComponent(nome)}%0a*E-mail:* ${encodeURIComponent(email)}%0a*Mensagem:* ${encodeURIComponent(msg)}`, '_blank'); toggleContactModal(false); });
modalEmail.addEventListener('click', () => { const nome = document.getElementById('modal-nome').value.trim(), email = document.getElementById('modal-email').value.trim(), msg = document.getElementById('modal-msg').value.trim(); if (!nome || !email || !msg) { alert('Preencha nome, e-mail e mensagem.'); return; } window.open(`mailto:jaymeibrahim@gmail.com?subject=Contato via portfólio&body=Nome: ${encodeURIComponent(nome)}%0AEmail: ${encodeURIComponent(email)}%0A%0A${encodeURIComponent(msg)}`, '_blank'); toggleContactModal(false); });
</script>
</body>
</html>
